<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        /* Archive 전용 다크 테마 탭 */
        .archive-category-tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .cat-tab-btn { padding: 10px 24px; border-radius: 4px; background: var(--bg-card); color: var(--text-sub); border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; font-family: var(--font-body); font-weight: 700;}
        .cat-tab-btn:hover { border-color: var(--text-main); color: var(--text-main); }
        .cat-tab-btn.active { background: var(--c-pink); border-color: var(--c-pink); color: #fff; }

        /* SNS 피드 가상 디자인 */
        .sns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .sns-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .sns-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sns-platform { font-size: 12px; font-weight: 800; font-family: var(--font-head); color: #1DA1F2; } /* 트위터색 */
        .sns-date { font-size: 12px; color: var(--text-sub); }
        .sns-img { width: 100%; height: 200px; background: #222; border-radius: 4px; margin-bottom: 15px; }
        .sns-text { font-size: 13px; line-height: 1.5; color: var(--text-main); }
    </style>
</head>
<body>

    <nav class="top-nav">
        <ul class="desktop-menu">

            <li><a href="fancam.html">FANCAM RANK</a></li>
            <li><a href="goods.html">MD & SUPPORT</a></li>
            <li><a href="archive.html" class="active" style="color: var(--text-main);">ARCHIVE</a></li>
        </ul>
    </nav>

    <div id="mainWrapper">
        <div class="section-container">
            <div class="section-header">
                <div class="section-title">RESCENE <span>ARCHIVE</span></div>
            </div>

            <div class="archive-category-tabs">
                <button class="cat-tab-btn">디스코그래피</button>
                <button class="cat-tab-btn active">SNS 통합 피드</button>
            </div>

            <!-- ⭐️ 5. 멤버별 SNS 통합 피드 영역 -->
            <div class="sns-grid">
                <div class="sns-card">
                    <div class="sns-header">
                        <span class="sns-platform">X (Twitter)</span>
                        <span class="sns-date">2026.07.24</span>
                    </div>
                    <div class="sns-img"></div>
                    <div class="sns-text">[#메이] 오늘 음악중심 무대 어땠나요?! 팬분들 응원 소리 덕분에 힘이 났어요🔥 내일도 화이팅! #RESCENE #MAY</div>
                </div>
                <div class="sns-card">
                    <div class="sns-header">
                        <span class="sns-platform" style="background: -webkit-linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Instagram</span>
                        <span class="sns-date">2026.07.23</span>
                    </div>
                    <div class="sns-img"></div>
                    <div class="sns-text">리센느 첫 번째 생일 카페 투어 완료! 너무 예쁘게 꾸며주셔서 감사합니다💖 #리브 #LIV</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
