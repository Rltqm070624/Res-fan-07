<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MEMBERS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;600;800;900&family=Noto+Sans+KR:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- ⭐️ 상위 폴더의 공통 CSS와 자신의 폴더에 있는 CSS 호출 -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/i18n.css">
    <link rel="stylesheet" href="member.css">

    <script>
        (function() { const saved = localStorage.getItem('rescene-theme') || 'dark'; document.documentElement.setAttribute('data-theme', saved); })();
    </script>
</head>
<body>
    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('members', '../', { calendar: true, lang: false });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container reveal active" style="flex: 1;">
            <div class="section-header">
                <div class="section-title">THE <span>MEMBERS</span></div>
            </div>

            <div class="member-wrapper">
                <!-- ⭐️ 이미지는 상위 폴더의 images 폴더 참조 -->
                <div class="member-card-v2">
                    <div class="member-photo-v2"><img src="../images/원이.webp" alt="원이" onerror="this.style.display='none'"></div>
                    <div class="member-info"><div class="name-bar">원이 WONI</div><div class="bday">2004. 05. 25. · 리더 / 보컬</div></div>
                </div>
                <div class="member-card-v2">
                    <div class="member-photo-v2"><img src="../images/리브.webp" alt="리브" onerror="this.style.display='none'"></div>
                    <div class="member-info"><div class="name-bar">리브 LIV</div><div class="bday">2006. 10. 11. · 보컬</div></div>
                </div>
                <div class="member-card-v2">
                    <div class="member-photo-v2"><img src="../images/미나미.webp" alt="미나미" onerror="this.style.display='none'"></div>
                    <div class="member-info"><div class="name-bar">미나미 MINAMI</div><div class="bday">2006. 11. 29. · 보컬 / 댄스 / 랩</div></div>
                </div>
                <div class="member-card-v2">
                    <div class="member-photo-v2"><img src="../images/메이.webp" alt="메이" onerror="this.style.display='none'"></div>
                    <div class="member-info"><div class="name-bar">메이 MAY</div><div class="bday">2008. 08. 19. · 보컬</div></div>
                </div>
                <div class="member-card-v2">
                    <div class="member-photo-v2"><img src="../images/제나.webp" alt="제나" onerror="this.style.display='none'"></div>
                    <div class="member-info"><div class="name-bar">제나 ZENA</div><div class="bday">2008. 11. 27. · 보컬 / 댄스</div></div>
                </div>
            </div>
        </div>

        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <!-- 캘린더 중앙 팝업 모달 -->
    <div class="modal-backdrop cal-backdrop" id="calPopupBackdrop" onclick="closeCalendarPopup()"></div>
    <div class="calendar-popup-wrapper" id="calendarPopupModal">
        <button class="close-btn" onclick="closeCalendarPopup()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="calendar-header-controls">
            <button class="cal-btn" onclick="changeMonth(-1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
            <div class="calendar-title" id="calendarMonthText">2026. 07</div>
            <button class="cal-btn" onclick="changeMonth(1)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="calendar-grid"><div class="weekday" data-wd="0">SUN</div><div class="weekday" data-wd="1">MON</div><div class="weekday" data-wd="2">TUE</div><div class="weekday" data-wd="3">WED</div><div class="weekday" data-wd="4">THU</div><div class="weekday" data-wd="5">FRI</div><div class="weekday" data-wd="6">SAT</div></div>
        <div class="calendar-grid" id="calendarDays"></div>
        <div class="calendar-legend">
            <span class="legend-item"><span class="legend-dot" style="background:#7e57c2"></span>방송</span>
            <span class="legend-item"><span class="legend-dot" style="background:#ffa726"></span>라디오</span>
            <span class="legend-item"><span class="legend-dot" style="background:#66bb6a"></span>행사</span>
            <span class="legend-item"><span class="legend-dot" style="background:#ec407a"></span>팬사인회</span>
            <span class="legend-item"><span class="legend-dot" style="background:#26c6da"></span>공연</span>
            <span class="legend-item"><span class="legend-dot" style="background:#78909c"></span>공지</span>
        </div>
    </div>

    <!-- 스케줄 상세 정보 모달 -->
    <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"></div>
    <div class="modal-wrapper" id="scheduleModal">
        <div class="sheet-drag-handle" id="scheduleSheetHandle"></div>
        <button class="close-btn" onclick="closeModal()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        <div class="modal-header-flex"><div class="modal-date" id="modalDateTitle"></div></div>
        <div id="modalScheduleText"></div>
    </div>

    <script>
        // 하위 폴더(member/)에서 실행되므로 이미지 경로 앞에 ../ 를 붙여야 함
        var SITE_ROOT = '../';
    </script>
    <script src="../js/common.js"></script>
</body>
</html>
