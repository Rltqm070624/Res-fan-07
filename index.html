<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; background: #121212; color: #e0e0e0; }
        .header { position: absolute; top: 30px; left: 40px; z-index: 10; }
        .header img { width: 180px; filter: drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.7)); }

        .video-container { position: relative; width: 100%; height: 50vh; overflow: hidden; background: #000; }
        .video-container iframe { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; min-height: 50vh; min-width: 88.88vh; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.8; }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(18,18,18,0.2) 0%, rgba(18,18,18,0.6) 70%, rgba(18,18,18,1) 100%); }

        .main-chart-container { padding: 40px 20px; max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }
        .section-header { font-size: 14px; font-weight: 500; color: #888; letter-spacing: 4px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: flex-end; }
        .section-header span.title-hl { color: #fff; font-size: 20px; letter-spacing: 2px; font-weight: 700; margin-left: 10px; }
        .update-time { font-size: 12px; color: #ff3399; font-weight: 400; letter-spacing: 1px; } 
        
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; margin-top: 20px; }
        .platform-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px; transition: 0.2s ease; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .platform-card:hover { transform: translateY(-4px); border-color: #ff3399; box-shadow: 0 8px 20px rgba(255,51,153,0.15); }
        .platform-name { font-weight: 900; font-size: 18px; color: #fff; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: space-between; }
        .platform-name span { font-size: 11px; font-weight: 400; color: #888; background: #222; padding: 3px 8px; border-radius: 10px; }

        .chart-group { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #2a2a2a; }
        .chart-group:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .chart-type-title { font-size: 12px; color: #ff3399; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
        
        .song-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .song-row:last-child { margin-bottom: 0; }
        .song-title { font-size: 13px; color: #ddd; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
        .song-title.out { color: #555; }
        
        .chart-rank-info { display: flex; align-items: center; gap: 8px; }
        .chart-rank { font-size: 14px; color: #fff; font-weight: 700; }
        
        .rank-diff { font-size: 11px; font-weight: 700; width: 40px; text-align: right; }
        .diff-up { color: #ff3399; }
        .diff-down { color: #4dabf7; }
        .diff-new { color: #ffd43b; }
        .diff-out { color: #555; } 
        .loading-text { color: #ff3399; font-weight: bold; text-align: center; width: 100%; padding: 30px; grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="header"><img src="logo.jpg" alt="RESCENE Logo"></div>
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1&loop=1&playlist=jfKfPfyJRdk&controls=0&showinfo=0&rel=0" allow="autoplay; fullscreen"></iframe>
        <div class="video-overlay"></div>
    </div>

    <div class="main-chart-container">
        <div class="section-header">
            <div>MUSIC CHARTS <span class="title-hl">REAL-TIME</span></div>
            <div class="update-time" id="currentTime">업데이트 중...</div>
        </div>
        <div class="chart-grid" id="mainChartGrid">
            <div class="loading-text">실시간 차트 데이터를 불러오는 중입니다... 🔄</div>
        </div>
    </div>

    <script>
        async function fetchRealTimeCharts() {
            const chartGrid = document.getElementById('mainChartGrid');
            const timeEl = document.getElementById('currentTime');
            
            try {
                const response = await fetch('chart_data.json?t=' + new Date().getTime());
                const data = await response.json();
                
                timeEl.innerText = data.update_time;
                chartGrid.innerHTML = '';
                const chartsData = data.charts;

                for (const [platform, charts] of Object.entries(chartsData)) {
                    let groupsHtml = '';
                    
                    for(const chartType in charts) {
                        const songs = charts[chartType];
                        let songsHtml = '';
                        
                        if (songs && songs.length > 0) {
                            songs.forEach(song => {
                                let diffClass = (song.diff.includes('▲') ? 'diff-up' : (song.diff.includes('▼') ? 'diff-down' : (song.diff === 'NEW' ? 'diff-new' : '')));
                                songsHtml += `
                                    <div class="song-row">
                                        <span class="song-title">${song.title}</span>
                                        <div class="chart-rank-info">
                                            <span class="chart-rank">${song.rank}위</span>
                                            <span class="rank-diff ${diffClass}">${song.diff}</span>
                                        </div>
                                    </div>
                                `;
                            });
                        } else {
                            songsHtml = `
                                <div class="song-row">
                                    <span class="song-title out">진입 곡 없음</span>
                                    <div class="chart-rank-info">
                                        <span class="chart-rank" style="color: #666;">OUT</span>
                                        <span class="rank-diff diff-out">-</span>
                                    </div>
                                </div>
                            `;
                        }
                        groupsHtml += `<div class="chart-group"><div class="chart-type-title">${chartType}</div>${songsHtml}</div>`;
                    }

                    let platformBadge = platform === "Circle Chart" ? "<span>구 가온차트</span>" : "";
                    chartGrid.innerHTML += `<div class="platform-card"><div class="platform-name">${platform} ${platformBadge}</div><div class="platform-charts">${groupsHtml}</div></div>`;
                }
            } catch (error) {
                chartGrid.innerHTML = `<div class="loading-text" style="color:red;">데이터 연동을 기다리는 중입니다... (최대 1시간 소요)</div>`;
            }
        }
        window.addEventListener('DOMContentLoaded', fetchRealTimeCharts);
    </script>
</body>
</html>
