<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; background: #121212; color: #e0e0e0; }
        
        /* 상단 영상 & 로고 */
        .video-container { position: relative; width: 100%; height: 50vh; overflow: hidden; background: #000; }
        .video-container iframe { position: absolute; top: 50%; left: 50%; width: 100vw; height: 56.25vw; min-height: 50vh; min-width: 88.88vh; transform: translate(-50%, -50%); pointer-events: none; opacity: 0.8; }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(18,18,18,0.2) 0%, rgba(18,18,18,0.6) 70%, rgba(18,18,18,1) 100%); }

        .logo-banner-section { width: 100%; background: #121212; text-align: center; padding: 25px 0 10px 0; position: relative; z-index: 5; }
        .logo-banner-section img { max-width: 350px; width: 70%; height: auto; filter: drop-shadow(0px 0px 6px rgba(255, 255, 255, 1)) drop-shadow(0px 0px 15px rgba(255, 51, 153, 0.9)) drop-shadow(0px 0px 30px rgba(255, 51, 153, 0.7)); }

        /* ⭐️ 가로형 음원 차트 영역 (수정됨) */
        .main-chart-container { padding: 30px 20px 50px 20px; max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }
        .section-header { font-size: 14px; font-weight: 500; color: #888; letter-spacing: 4px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
        .section-header span.title-hl { color: #fff; font-size: 20px; letter-spacing: 2px; font-weight: 700; margin-left: 10px; }
        .update-time { font-size: 12px; color: #ff3399; font-weight: 400; letter-spacing: 1px; } 
        
        .chart-list-container { display: flex; flex-direction: column; gap: 15px; }
        
        .platform-row { display: flex; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; }
        .platform-row:hover { border-color: #555; }
        
        .platform-name-col { width: 140px; background: #222; padding: 20px; font-weight: 900; font-size: 18px; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; border-right: 1px solid #333; letter-spacing: 1px; }
        
        .platform-charts-col { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
        
        .chart-type-row { display: flex; align-items: center; border-bottom: 1px dashed #333; padding-bottom: 12px; }
        .chart-type-row:last-child { border-bottom: none; padding-bottom: 0; }
        
        .chart-type-name { width: 120px; font-size: 14px; color: #aaa; font-weight: 700; flex-shrink: 0; }
        
        .chart-songs-list { display: flex; flex-wrap: wrap; gap: 20px; flex: 1; align-items: center; }
        .song-item { display: flex; align-items: center; gap: 8px; font-size: 14px; background: #111; padding: 6px 12px; border-radius: 20px; border: 1px solid #2a2a2a; }
        .song-item .title { color: #eee; font-weight: 500; }
        .song-item .rank { color: #fff; font-weight: 700; }
        .song-item .out { color: #666; font-weight: 700; }
        
        .rank-diff { font-size: 12px; font-weight: 700; }
        .diff-up { color: #ff3b30; }
        .diff-down { color: #007aff; }
        .diff-new { color: #ffd60a; }
        .diff-none { color: #888; }
        
        .loading-text { color: #ff3399; font-weight: bold; text-align: center; width: 100%; padding: 30px; }

        /* 캘린더 영역 */
        .calendar-container { padding: 50px 20px; max-width: 1000px; margin: 0 auto; }
        .calendar-header { text-align: center; font-size: 14px; font-weight: 500; color: #888; letter-spacing: 4px; margin-bottom: 40px; }
        .calendar-header span { color: #fff; font-size: 24px; font-weight: 700; letter-spacing: 2px; margin-left: 10px; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .weekday { text-align: center; color: #555; font-size: 12px; font-weight: 700; padding-bottom: 15px; }
        .day-cell { background: #1a1a1a; border-radius: 8px; min-height: 120px; padding: 15px; position: relative; cursor: pointer; transition: 0.2s ease; border: 1px solid transparent; }
        .day-cell:hover { background: #222; border-color: #ff3399; }
        .day-cell.empty { background: transparent; cursor: default; border: none; }
        .day-number { font-size: 15px; color: #ccc; font-weight: 500; }
        
        .schedule-badge { position: absolute; bottom: 15px; left: 15px; background: rgba(255, 51, 153, 0.1); color: #ff3399; font-size: 11px; padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(255, 51, 153, 0.3); }

        /* ⭐️ 우측 슬라이드 팝업창 영역 (수정됨) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; display: flex; justify-content: flex-end; opacity: 0; visibility: hidden; transition: 0.3s ease; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-content { background: #121212; width: 100%; max-width: 480px; height: 100vh; padding: 40px 30px; position: relative; border-left: 1px solid #333; box-shadow: -10px 0 30px rgba(0,0,0,0.8); transform: translateX(100%); transition: transform 0.3s ease; overflow-y: auto; box-sizing: border-box; }
        .modal-overlay.active .modal-content { transform: translateX(0); }
        
        .close-btn { position: absolute; top: 30px; right: 30px; color: #888; font-size: 32px; cursor: pointer; background: none; border: none; line-height: 1; padding: 0; transition: 0.2s; }
        .close-btn:hover { color: #fff; transform: rotate(90deg); }
        
        .modal-date { font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #222; }
        
        .modal-section-title { font-size: 13px; color: #ff3399; font-weight: 700; letter-spacing: 2px; margin-bottom: 15px; margin-top: 35px; }
        
        .modal-video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; background: #000; border: 1px solid #333; }
        .modal-video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .no-data-text { color: #666; font-size: 14px; background: #1a1a1a; padding: 20px; border-radius: 8px; text-align: center; border: 1px dashed #333; }
        
        .modal-schedule-box { background: #1a1a1a; padding: 20px; border-radius: 12px; color: #ddd; font-size: 15px; border: 1px solid #333; white-space: pre-line; line-height: 1.6; }

        /* ⭐️ 사진 모아보기 영역 추가 */
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .photo-grid img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; border: 1px solid #333; transition: 0.2s; cursor: pointer; }
        .photo-grid img:hover { border-color: #ff3399; filter: brightness(1.1); }

        @media (max-width: 768px) {
            .platform-row { flex-direction: column; }
            .platform-name-col { width: 100%; border-right: none; border-bottom: 1px solid #333; padding: 15px; }
            .chart-type-row { flex-direction: column; align-items: flex-start; gap: 10px; }
            .chart-type-name { width: 100%; border-bottom: 1px solid #222; padding-bottom: 5px; }
            .day-cell { min-height: 80px; padding: 10px; }
            .schedule-badge { font-size: 10px; padding: 2px 4px; bottom: 8px; left: 8px; }
            .modal-content { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/ZbO9PBdFRdc?autoplay=1&mute=1&loop=1&playlist=ZbO9PBdFRdc&controls=0&showinfo=0&rel=0" allow="autoplay; fullscreen"></iframe>
        <div class="video-overlay"></div>
    </div>
    <div class="logo-banner-section">
        <img src="logo.png" alt="RESCENE Logo" onerror="this.style.display='none'">
    </div>

    <!-- 1. 차트 영역 (가로형) -->
    <div class="main-chart-container">
        <div class="section-header">
            <div>SONG CHARTS <span class="title-hl">TRACKING</span></div>
            <div class="update-time" id="currentTime">업데이트 중...</div>
        </div>
        <div class="chart-list-container" id="mainChartGrid">
            <div class="loading-text">데이터 연동을 기다리는 중입니다...</div>
        </div>
    </div>

    <!-- 2. 캘린더 영역 -->
    <div class="calendar-container">
        <div class="calendar-header" id="calendarHeader">
            ARCHIVE SCHEDULE <span id="calendarMonthText">2026. 07</span>
        </div>
        <div class="calendar-grid">
            <div class="weekday">SUN</div>
            <div class="weekday">MON</div>
            <div class="weekday">TUE</div>
            <div class="weekday">WED</div>
            <div class="weekday">THU</div>
            <div class="weekday">FRI</div>
            <div class="weekday">SAT</div>
        </div>
        <div class="calendar-grid" id="calendarDays"></div>
    </div>

    <!-- 3. 우측 슬라이드 팝업창 -->
    <div class="modal-overlay" id="scheduleModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div class="modal-date" id="modalDateTitle">2026. 07. 04.</div>
            
            <div class="modal-section-title">TODAY'S SCENE (VIDEO)</div>
            <div id="modalVideoContainer"></div>
            
            <div class="modal-section-title">SCHEDULE</div>
            <div id="modalScheduleText"></div>

            <div class="modal-section-title">TODAY'S PHOTOS</div>
            <div class="photo-grid" id="modalPhotoContainer"></div>
        </div>
    </div>

    <script>
        // --- 1. 가로형 음원 차트 로직 ---
        function getDiffClass(diffText) {
            if (!diffText) return 'diff-none';
            if (diffText.includes('▲')) return 'diff-up';
            if (diffText.includes('▼')) return 'diff-down';
            if (diffText === 'NEW') return 'diff-new';
            return 'diff-none';
        }

        async function fetchSongCharts() {
            const chartGrid = document.getElementById('mainChartGrid');
            const timeEl = document.getElementById('currentTime');
            
            try {
                const response = await fetch('chart_data.json?t=' + new Date().getTime());
                const data = await response.json();
                
                timeEl.innerText = data.update_time;
                const songsData = data.songs;
                const platforms = ["Melon", "Bugs", "Genie", "FLO", "VIBE"]; // 표기할 플랫폼 순서
                let finalHtml = '';

                platforms.forEach(platform => {
                    // 플랫폼별로 존재하는 차트 종류(HOT100, 일간 등) 수집
                    const chartTypesSet = new Set();
                    for (const songTitle in songsData) {
                        if (songsData[songTitle][platform]) {
                            Object.keys(songsData[songTitle][platform]).forEach(ct => chartTypesSet.add(ct));
                        }
                    }

                    if (chartTypesSet.size > 0) {
                        let chartsHtml = '';
                        chartTypesSet.forEach(chartType => {
                            let songsHtml = '';
                            
                            // 모든 곡에 대해 해당 플랫폼/차트타입의 순위 탐색
                            for (const songTitle in songsData) {
                                const songRecord = songsData[songTitle][platform]?.[chartType];
                                if (songRecord) {
                                    const diffClass = getDiffClass(songRecord.diff);
                                    songsHtml += `
                                        <div class="song-item">
                                            <span class="title">${songTitle}</span> 
                                            <span class="rank">${songRecord.rank}위</span> 
                                            <span class="rank-diff ${diffClass}">${songRecord.diff}</span>
                                        </div>`;
                                } else {
                                    songsHtml += `
                                        <div class="song-item" style="opacity: 0.6;">
                                            <span class="title" style="color:#aaa;">${songTitle}</span> 
                                            <span class="out">OUT</span>
                                        </div>`;
                                }
                            }
                            
                            chartsHtml += `
                                <div class="chart-type-row">
                                    <div class="chart-type-name">${chartType}</div>
                                    <div class="chart-songs-list">${songsHtml}</div>
                                </div>`;
                        });

                        finalHtml += `
                            <div class="platform-row">
                                <div class="platform-name-col">${platform}</div>
                                <div class="platform-charts-col">${chartsHtml}</div>
                            </div>`;
                    }
                });
                
                chartGrid.innerHTML = finalHtml || `<div class="loading-text">데이터가 없습니다.</div>`;

            } catch (error) {
                chartGrid.innerHTML = `<div class="loading-text" style="color:#ff3399;">데이터 갱신 대기 중...</div>`;
            }
        }

        // --- 2. 캘린더 및 우측 팝업 로직 ---
        // 하드코딩된 스케줄/영상/사진 데이터 (사진은 이미지 URL 배열로 입력)
        const scheduleDB = {
            "2026-07-24": {
                hasSchedule: true,
                youtubeId: "ZbO9PBdFRdc",
                text: "[방송] KBS 뮤직뱅크\n[싸인회] 핫트랙스 영등포점",
                photos: [
                    "https://pbs.twimg.com/media/GPMQ4YubQAAn9Kj?format=jpg&name=large", 
                    "https://pbs.twimg.com/media/GPMQ4Yva0AAVn2E?format=jpg&name=large"
                ] // 임시 예시 이미지 주소
            },
            "2026-07-25": {
                hasSchedule: true,
                youtubeId: "",
                text: "[방송] MBC 쇼! 음악중심 오후 3시 15분",
                photos: []
            }
        };

        const targetYear = 2026;
        const targetMonth = 7; 

        function renderCalendar() {
            const calendarDays = document.getElementById('calendarDays');
            const monthText = document.getElementById('calendarMonthText');
            monthText.innerText = `${targetYear}. ${String(targetMonth).padStart(2, '0')}`;
            
            const firstDayIndex = new Date(targetYear, targetMonth - 1, 1).getDay(); 
            const lastDate = new Date(targetYear, targetMonth, 0).getDate(); 
            
            let html = '';
            for (let i = 0; i < firstDayIndex; i++) {
                html += `<div class="day-cell empty"></div>`;
            }
            
            for (let i = 1; i <= lastDate; i++) {
                const dateKey = `${targetYear}-${String(targetMonth).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const schedule = scheduleDB[dateKey];
                
                let badgeHtml = '';
                if (schedule && schedule.hasSchedule) {
                    badgeHtml = `<div class="schedule-badge">스케줄 있음</div>`;
                }

                html += `
                    <div class="day-cell" onclick="openModal('${targetYear}', '${targetMonth}', '${i}', '${dateKey}')">
                        <div class="day-number">${i}</div>
                        ${badgeHtml}
                    </div>
                `;
            }
            calendarDays.innerHTML = html;
        }

        // 모달 열기
        function openModal(year, month, day, dateKey) {
            const modal = document.getElementById('scheduleModal');
            const titleEl = document.getElementById('modalDateTitle');
            const videoContainer = document.getElementById('modalVideoContainer');
            const textEl = document.getElementById('modalScheduleText');
            const photoContainer = document.getElementById('modalPhotoContainer');
            
            titleEl.innerText = `${year}. ${String(month).padStart(2, '0')}. ${String(day).padStart(2, '0')}.`;
            
            const data = scheduleDB[dateKey] || { hasSchedule: false, youtubeId: "", text: "등록된 스케줄이 없습니다.", photos: [] };
            
            // 영상 처리
            if (data.youtubeId) {
                videoContainer.innerHTML = `<div class="modal-video-wrapper"><iframe src="https://www.youtube.com/embed/${data.youtubeId}?rel=0" allowfullscreen></iframe></div>`;
            } else {
                videoContainer.innerHTML = `<div class="no-data-text">등록된 영상이 없습니다.</div>`;
            }
            
            // 스케줄 텍스트 처리
            textEl.innerHTML = `<div class="modal-schedule-box">${data.text}</div>`;
            
            // 사진 처리
            if (data.photos && data.photos.length > 0) {
                let photoHtml = '';
                data.photos.forEach(url => {
                    // 클릭 시 원본 이미지 새 탭에서 열기
                    photoHtml += `<img src="${url}" alt="Today Photo" onclick="window.open('${url}', '_blank')">`;
                });
                photoContainer.innerHTML = photoHtml;
            } else {
                photoContainer.innerHTML = `<div class="no-data-text" style="grid-column: 1 / -1;">업로드된 사진이 없습니다.</div>`;
            }
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; 
        }

        // 모달 닫기
        function closeModal() {
            const modal = document.getElementById('scheduleModal');
            const videoContainer = document.getElementById('modalVideoContainer');
            
            modal.classList.remove('active');
            document.body.style.overflow = 'auto'; 
            
            // 애니메이션이 끝난 후 영상 종료 (소리 방지)
            setTimeout(() => {
                videoContainer.innerHTML = ''; 
            }, 300);
        }

        // 검은 배경 클릭 시 닫기
        document.getElementById('scheduleModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            fetchSongCharts();
            renderCalendar();
        });
    </script>
</body>
</html>
