<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | ALL PHOTOS & ALBUMS</title>
    <meta name="description" content="RESCENE PROFILE ARCHIVE.">
    <link rel="icon" type="image/png" href="images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/i18n.css">

    <script src="js/theme-init.js"></script>
</head>
<body>

    <div id="siteNavSlot"></div>
    <script src="js/layout.js"></script>
    <script>renderSiteNav('', '', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container" style="flex: 1; max-width: 100%; padding-left: 48px; padding-right: 48px; padding-bottom: 80px; box-sizing: border-box;">
            <div class="section-header">
                <div class="section-title">ALL <span>PHOTOS & ALBUMS</span></div>
            </div>

            <div class="archive-sub-header" id="profile">PROFILE PHOTO</div>
            <div class="profile-track full-gallery-grid" id="fullProfileGrid"></div>

            <div class="archive-sub-header mt-40" id="album">ALBUM</div>
            <div class="profile-track full-gallery-grid" id="fullAlbumGrid"></div>
        </div>

        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('');</script>
    </div>

    <div class="modal-backdrop image-modal-backdrop" id="imageModalBackdrop" onclick="closeImageModal()"></div>
    <div class="image-modal-wrapper" id="imageModal" onclick="closeImageModal()">
        <img src="" id="fullSizeImage" alt="Full Size View">
    </div>

    <div class="modal-backdrop" id="albumModalBackdrop" onclick="closeAlbumModal()"></div>
    <div class="album-modal-wrapper" id="albumModal">
        <button class="popup-close-btn" onclick="closeAlbumModal()" aria-label="앨범 닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="album-modal-media" id="albumMediaWrap"></div>
        <div class="album-modal-info">
            <img class="album-modal-cover" id="albumModalCover" alt="" onerror="this.style.display='none'">
            <div class="album-modal-title" id="albumModalTitle"></div>
            <div class="album-tracklist-label">TRACK LIST</div>
            <div class="album-track-list" id="albumTrackList"></div>
        </div>
    </div>
    <button type="button" class="album-nav-btn album-nav-prev" onclick="navigateAlbumModal(-1)" aria-label="이전 앨범">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button type="button" class="album-nav-btn album-nav-next" onclick="navigateAlbumModal(1)" aria-label="다음 앨범">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>

    <div id="siteCalendarSlot"></div>
    <script>renderCalendarWidgets();</script>

    <script src="js/i18n.js"></script>
    <script src="js/member_data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
