        // 앨범 목록을 가운데 정렬된 한 줄 카드로 렌더링
        function renderList() {
            const container = document.getElementById('archiveListContainer');
            container.innerHTML = '';
            
            archiveData.forEach((album, albumIdx) => {
                const item = document.createElement('div');
                item.className = 'archive-item';
                // 행 클릭 시 우측 팝업 열기
                item.onclick = () => openAlbumModal(albumIdx);
                
                item.innerHTML = `
                    <div class="archive-item-header">
                        <div class="archive-item-thumb">
                            <img src="${album.cover}" alt="cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=NO+IMG'">
                        </div>
                        <div class="archive-item-title">${album.title}</div>
                        <div class="archive-item-icon">▶</div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 우측 팝업 열기 및 수록곡(트랙) 아코디언 생성
        function openAlbumModal(albumIdx) {
            const album = archiveData[albumIdx];
            document.getElementById('modalAlbumTitle').innerText = album.title;
            document.getElementById('modalAlbumCover').src = album.cover;
            
            const trackListEl = document.getElementById('modalTrackList');
            let trackHtml = '';
            
            album.tracks.forEach((track, tIdx) => {
                // 영상들을 카테고리(탭)별로 분류
                let cats = { 'MV': [], '무대': [], '직캠': [], '음원': [], '기타': [] };
                
                if (track.videos) {
                    track.videos.forEach(vid => {
                        let cat = '기타';
                        let lbl = vid.label.toLowerCase();
                        if(lbl.includes('mv')) cat = 'MV';
                        else if(lbl.includes('음원') || lbl.includes('audio')) cat = '음원';
                        else if(lbl.includes('직캠') || lbl.includes('fancam') || lbl.includes('캠')) cat = '직캠';
                        else if(lbl.includes('엠카') || lbl.includes('뮤뱅') || lbl.includes('인기가요') || lbl.includes('음중') || lbl.includes('쇼챔') || lbl.includes('더쇼') || lbl.includes('perf') || lbl.includes('showcase') || lbl.includes('live') || lbl.includes('방송분')) cat = '무대';
                        
                        cats[cat].push(vid);
                    });
                }

                // 빈 카테고리 탭 제외
                let availableTabs = Object.keys(cats).filter(k => cats[k].length > 0);
                
                let tabsHtml = '';
                let vBtnsHtml = '';

                if (availableTabs.length > 0) {
                    availableTabs.forEach((tabName, tabIndex) => {
                        const isActiveTab = tabIndex === 0 ? 'active' : '';
                        tabsHtml += `<button class="sub-tab-btn ${isActiveTab}" onclick="selectTrackTab(${albumIdx}, ${tIdx}, '${tabName}', this)">${tabName}</button>`;

                        // 기본적으로 첫 번째 탭의 비디오 버튼들을 그려둠
                        if (tabIndex === 0) {
                            cats[tabName].forEach((vid, vIdx) => {
                                const isActiveBtn = vIdx === 0 ? 'active' : '';
                                vBtnsHtml += `<button class="video-btn ${isActiveBtn}" onclick="playVideo('player_${albumIdx}_${tIdx}', '${vid.id}', this)">${vid.label}</button>`;
                            });
                        }
                    });
                } else {
                    tabsHtml = `<div style="font-size:13px; color:#888;">등록된 영상이 없습니다.</div>`;
                }

                trackHtml += `
                    <div class="track-item" id="track_${albumIdx}_${tIdx}">
                        <div class="track-title" onclick="toggleTrack(${albumIdx}, ${tIdx})">${track.title} <span>▼</span></div>
                        <div class="track-content">
                            <div class="sub-tabs-container" id="tabs_${albumIdx}_${tIdx}">${tabsHtml}</div>
                            <div class="video-btn-list" id="vbtns_${albumIdx}_${tIdx}">${vBtnsHtml}</div>
                            <div class="inline-player-wrapper" id="player_${albumIdx}_${tIdx}"></div>
                        </div>
                    </div>
                `;
            });

            trackListEl.innerHTML = trackHtml;

            // 탭 클릭 시 불러올 수 있도록 글로벌 변수에 카테고리 데이터 임시 저장
            window.currentAlbumData = album.tracks.map(track => {
                let cats = { 'MV': [], '무대': [], '직캠': [], '음원': [], '기타': [] };
                if (track.videos) {
                    track.videos.forEach(vid => {
                        let cat = '기타';
                        let lbl = vid.label.toLowerCase();
                        if(lbl.includes('mv')) cat = 'MV';
                        else if(lbl.includes('음원') || lbl.includes('audio')) cat = '음원';
                        else if(lbl.includes('직캠') || lbl.includes('fancam') || lbl.includes('캠')) cat = '직캠';
                        else if(lbl.includes('엠카') || lbl.includes('뮤뱅') || lbl.includes('인기가요') || lbl.includes('음중') || lbl.includes('쇼챔') || lbl.includes('더쇼') || lbl.includes('perf') || lbl.includes('showcase') || lbl.includes('live') || lbl.includes('방송분')) cat = '무대';
                        cats[cat].push(vid);
                    });
                }
                return cats;
            });

            // 모달 열기 애니메이션 트리거 (메인 화면 왼쪽으로 이동)
            document.getElementById('albumModal').classList.add('active');
            document.body.classList.add('modal-open');
        }

        // 수록곡 클릭 시 아코디언 펼치기
        function toggleTrack(albumIdx, tIdx) {
            const el = document.getElementById(`track_${albumIdx}_${tIdx}`);
            const isOpening = !el.classList.contains('active');

            // 다른 열려있는 곡들은 닫고 영상 끄기
            document.querySelectorAll('.track-item').forEach(item => {
                item.classList.remove('active');
                const player = item.querySelector('.inline-player-wrapper');
                if (player) player.innerHTML = '';
            });

            // 방금 누른 곡만 펼치고, 첫 번째 영상 자동재생 시작
            if (isOpening) {
                el.classList.add('active');
                const firstVideoBtn = el.querySelector('.video-btn.active');
                if (firstVideoBtn) {
                    firstVideoBtn.click();
                }
            }
        }

        // MV, 직캠 등 하위 탭 클릭 이벤트
        function selectTrackTab(albumIdx, tIdx, tabName, btnEl) {
            const siblings = btnEl.parentElement.children;
            for(let i=0; i<siblings.length; i++) siblings[i].classList.remove('active');
            btnEl.classList.add('active');

            const videos = window.currentAlbumData[tIdx][tabName];
            const btnContainer = document.getElementById(`vbtns_${albumIdx}_${tIdx}`);

            let vBtnsHtml = '';
            videos.forEach((vid, vIdx) => {
                const isActive = vIdx === 0 ? 'active' : '';
                vBtnsHtml += `<button class="video-btn ${isActive}" onclick="playVideo('player_${albumIdx}_${tIdx}', '${vid.id}', this)">${vid.label}</button>`;
            });
            btnContainer.innerHTML = vBtnsHtml;

            // 탭 변경 시 첫 번째 영상 바로 재생
            if(videos.length > 0) {
                playVideo(`player_${albumIdx}_${tIdx}`, videos[0].id, btnContainer.firstElementChild);
            }
        }

        // 유튜브 영상 재생
        function playVideo(playerId, ytId, btnEl) {
            if(btnEl) {
                const siblings = btnEl.parentElement.children;
                for(let i=0; i<siblings.length; i++) siblings[i].classList.remove('active');
                btnEl.classList.add('active');
            }

            const player = document.getElementById(playerId);
            player.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0" allow="autoplay; fullscreen"></iframe>`;
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('albumModal').classList.remove('active');
            document.body.classList.remove('modal-open');
            // 닫을 때 영상 소리 꺼지도록 HTML 비워주기
            setTimeout(() => { document.getElementById('modalTrackList').innerHTML = ''; }, 300);
        }

        window.addEventListener('DOMContentLoaded', () => { renderList(); });

    </script>
</body>
</html>
