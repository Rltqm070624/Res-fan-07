<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MERCH</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/i18n.css">
    <link rel="stylesheet" href="goods.css">

    <script src="../js/theme-init.js"></script>
</head>
<body>
    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('goods', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container goods-page-container reveal active" style="flex: 1;">
            <div class="section-header">
                <div class="section-title" data-i18n="merchTitle">OFFICIAL <span>MERCH</span></div>
                <div style="font-size:12px; color:var(--text-muted);">실시간 재고 상태 자동 확인중...</div>
            </div>
            
            <div class="goods-grid-v2" id="goodsGrid">
                <div class="goods-item" data-item="remini">
                    <div class="goods-img" id="remini-img-wrap"><img src="../images/goods/REMINI.jpg" alt="REMINI Set"><div class="soldout-stamp"><span>SOLD</span></div></div>
                    <div class="goods-price-text" id="remini-price">가격 확인중...</div>
                    <div class="goods-stock-list" id="remini-stock-list"></div>
                </div>
                <div class="goods-item" data-item="jota">
                    <div class="goods-img" id="jota-img-wrap"><img src="../images/goods/jota.jpg" alt="Jota"><div class="soldout-stamp"><span>SOLD</span></div></div>
                    <div class="goods-price-text" id="jota-price">가격 확인중...</div>
                    <div class="goods-stock-list" id="jota-stock-list"></div>
                </div>
                <div class="goods-item" data-item="ming">
                    <div class="goods-img" id="ming-img-wrap"><img src="../images/goods/ming.jpg" alt="Ming"><div class="soldout-stamp"><span>SOLD</span></div></div>
                    <div class="goods-price-text" id="ming-price">가격 확인중...</div>
                    <div class="goods-stock-list" id="ming-stock-list"></div>
                </div>
                <div class="goods-item" data-item="ribbu">
                    <div class="goods-img" id="ribbu-img-wrap"><img src="../images/goods/ribbu.jpg" alt="Ribbu"><div class="soldout-stamp"><span>SOLD</span></div></div>
                    <div class="goods-price-text" id="ribbu-price">가격 확인중...</div>
                    <div class="goods-stock-list" id="ribbu-stock-list"></div>
                </div>
                <div class="goods-item" data-item="jjaero">
                    <div class="goods-img" id="jjaero-img-wrap"><img src="../images/goods/jjaero.jpg" alt="Jjaero"><div class="soldout-stamp"><span>SOLD</span></div></div>
                    <div class="goods-price-text" id="jjaero-price">가격 확인중...</div>
                    <div class="goods-stock-list" id="jjaero-stock-list"></div>
                </div>
                <div class="goods-item" data-item="yam">
                    <div class="goods-img" id="yam-img-wrap"><img src="../images/goods/yam.jpg" alt="Yam"><div class="soldout-stamp"><span>SOLD</span></div></div>
                    <div class="goods-price-text" id="yam-price">가격 확인중...</div>
                    <div class="goods-stock-list" id="yam-stock-list"></div>
                </div>
            </div>
        </div>
        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <script>
        // 하위 폴더(goods/)에서 실행되므로 이미지/스크립트 경로 앞에 ../ 를 붙여야 함
        var SITE_ROOT = '../';
    </script>
    <script src="../js/i18n.js"></script>
    <script src="../js/member_data.js"></script>
    <script src="../js/common.js"></script>
    <script>
        function escapeHtmlGoods(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        async function fetchGoodsInventory() {
            try {
                const response = await fetch('goods_data.json?t=' + new Date().getTime());
                const data = await response.json();
                const items = ['remini', 'jota', 'ming', 'ribbu', 'jjaero', 'yam'];

                items.forEach(item => {
                    const entry = data[item];
                    const listEl = document.getElementById(`${item}-stock-list`);
                    const priceEl = document.getElementById(`${item}-price`);
                    const imgWrapper = document.getElementById(`${item}-img-wrap`);
                    if (!entry || !Array.isArray(entry.shops) || !listEl) return;

                    const shops = entry.shops.slice().sort((a, b) => {
                        // 가격 낮은 순, 가격 모르는 건 뒤로
                        if (a.priceNum == null) return 1;
                        if (b.priceNum == null) return -1;
                        return a.priceNum - b.priceNum;
                    });

                    // 대표 가격 표시: 최저가 쇼핑몰 기준
                    const cheapestShop = shops.find(s => s.shop === entry.cheapest) || shops[0];
                    priceEl.innerText = (cheapestShop && cheapestShop.price) ? cheapestShop.price : '가격 확인 필요';

                    // 전부 품절이면 이미지에 SOLD 도장
                    const allSoldOut = shops.length > 0 && shops.every(s => s.stock === 'soldout');
                    if (imgWrapper) imgWrapper.classList.toggle('is-soldout', allSoldOut);

                    listEl.innerHTML = shops.map(s => {
                        const isCheapest = s.shop === entry.cheapest && shops.length > 1;
                        const isSoldOut = s.stock === 'soldout';
                        const statusText = isSoldOut ? '(품절)' : (s.stock === 'unknown' ? '(확인중)' : '(재고 있음)');
                        return `
                            <div class="stock-row${isCheapest ? ' is-cheapest' : ''}">
                                <span class="shop-name">
                                    ${isCheapest ? '<span class="cheapest-badge">최저가</span>' : ''}
                                    ${escapeHtmlGoods(s.label)}
                                    <span class="stock-num">${statusText}</span>
                                    ${s.price ? `<span class="shop-price">${escapeHtmlGoods(s.price)}</span>` : ''}
                                </span>
                                <a href="${s.url}" target="_blank" class="buy-btn${isSoldOut ? ' sold-out' : ''}">${isSoldOut ? '품절' : '바로가기'}</a>
                            </div>`;
                    }).join('');
                });
            } catch (e) { console.log("굿즈 데이터 JSON 대기중..."); }
        }
    </script>

    <!-- 캘린더 팝업 + 세부 일정 모달 (공용 컴포넌트) -->
    <div id="siteCalendarSlot"></div>
    <script>renderCalendarWidgets();</script>

    <script>
        fetchGoodsInventory();
    </script>
</body>
</html>
