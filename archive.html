    <style>
        :root {
            --bg-body: #f5f6f8; --bg-card: #ffffff;

            --font-head: 'Montserrat', sans-serif; --font-num: 'Plus Jakarta Sans', sans-serif; --font-body: 'Noto Sans KR', sans-serif;
        }

        body, html { margin: 0; padding: 0; font-family: var(--font-body); background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; }

        .top-nav { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; box-sizing: border-box; z-index: 10000; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); }
        .desktop-menu { display: flex; gap: 30px; list-style: none; margin: 0; padding: 0; }
        .desktop-menu li a { color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 700; font-family: var(--font-head); transition: all 0.2s ease; }
        .desktop-menu li a:hover { color: var(--c-pink); }
        
        .sns-links { display: flex; gap: 10px; }
        .sns-links a { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; background: #f0f0f0; border-radius: 50%; border: 1px solid var(--border-color); transition: all 0.2s ease; }
        .sns-links a img { width: 18px; height: 18px; object-fit: contain; }
        .sns-links a:hover { background: #fff; border-color: var(--c-pink); transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,51,153,0.15); }

        .menu-toggle-btn { display: none; position: fixed; top: 15px; left: 15px; z-index: 10001; background: #fff; color: #333; border: 1px solid var(--border-color); border-radius: 8px; width: 42px; height: 42px; font-size: 20px; cursor: pointer; }
        .sidebar { position: fixed; top: 0; left: -260px; width: 260px; height: 100vh; background: #fff; border-right: 1px solid var(--border-color); z-index: 10000; transition: 0.3s ease; padding-top: 80px; }
        .sidebar.active { left: 0; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; opacity: 0; visibility: hidden; transition: 0.3s; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; }
        .sidebar li a { display: block; padding: 18px 30px; color: var(--text-main); text-decoration: none; font-family: var(--font-head); font-weight: 700; border-bottom: 1px solid var(--border-color); }

        /* ⭐️ 모달 스플릿 뷰를 위한 메인 래퍼 */
        body.modal-open #mainWrapper { transform: translateX(-240px); }
        #mainWrapper { padding: 120px 20px 60px 20px; max-width: 1050px; margin: 0 auto; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); width: 100%; box-sizing: border-box; }

        .section-header { margin-bottom: 30px; border-bottom: 2px solid var(--text-main); padding-bottom: 10px; display: flex; align-items: flex-end; }
        .section-title { font-family: var(--font-head); font-size: 28px; font-weight: 900; letter-spacing: 1px; color: var(--text-main); }
        .section-title span { color: var(--c-pink); }

        /* 앨범 그리드 */
        .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .album-card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .album-card:hover { border-color: var(--c-pink); transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255, 51, 153, 0.1); }
        .album-cover { width: 100%; aspect-ratio: 1 / 1; background: #eee; position: relative; }
        .album-cover img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .album-card:hover .album-cover img { transform: scale(1.05); }
        .album-info { padding: 15px; text-align: center; }
        .album-title { font-size: 15px; font-weight: 800; color: var(--text-main); font-family: var(--font-head); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* ⭐️ 앨범 팝업 (우측 모달) */
        .modal-wrapper { position: fixed; top: 0; right: 0; width: 480px; height: 100vh; background: #fff; z-index: 10000; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: -10px 0 30px rgba(0,0,0,0.1); overflow-y: auto; padding: 40px 30px; box-sizing: border-box; border-left: 1px solid var(--border-color); }
        .modal-wrapper.active { transform: translateX(0); }
        .close-btn { position: absolute; top: 30px; right: 30px; color: #999; font-size: 32px; cursor: pointer; background: none; border: none; line-height: 1; padding: 0; transition: 0.2s; }
        .close-btn:hover { color: var(--text-main); transform: rotate(90deg); }
        
        .modal-album-header { display: flex; flex-direction: column; align-items: center; border-bottom: 2px solid var(--text-main); padding-bottom: 20px; margin-bottom: 20px; text-align: center; }
        .modal-album-cover { width: 180px; height: 180px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 15px; background: #eee; }
        .modal-album-title { font-family: var(--font-head); font-size: 22px; font-weight: 900; color: var(--text-main); }
        
        /* 트랙 리스트 아코디언 */
        .track-list { display: flex; flex-direction: column; gap: 10px; }
        .track-item { background: var(--bg-body); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; }
        .track-title { padding: 15px 20px; font-weight: 700; font-size: 15px; color: var(--text-main); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .track-title:hover { background: #f0f0f0; color: var(--c-pink); }
        .track-content { display: none; padding: 15px 20px; border-top: 1px dashed var(--border-color); background: #fff; }
        .track-item.active .track-content { display: block; }
        
        /* 비디오 버튼들 */
        .video-btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .video-btn { background: #fff; border: 1px solid #ddd; color: #555; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .video-btn:hover, .video-btn.active { background: var(--c-pink); color: #fff; border-color: var(--c-pink); }
        
        /* 아이프레임 플레이어 */
        .inline-player-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background: #000; display: none; }
        .inline-player-wrapper.active { display: block; }
        .inline-player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        @media (max-width: 1000px) {
            body.modal-open #mainWrapper { transform: translateX(0); }
            .modal-wrapper { width: 100%; }
        }
        @media (max-width: 768px) {
            .top-nav { display: none; }
            .menu-toggle-btn { display: flex; align-items: center; justify-content: center; }
            #mainWrapper { padding-top: 90px; }
            .album-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .modal-wrapper { padding: 30px 20px; }
            .modal-album-cover { width: 140px; height: 140px; }
        }

                if(track.videos && track.videos.length > 0) {
                    track.videos.forEach((vid, vIdx) => {
                        btnHtml += `<button class="video-btn" onclick="playVideo('player_${tIdx}', '${vid.id}', this)">${vid.label}</button>`;
                    });
                } else {
                    btnHtml = `<div style="font-size:12px; color:#888;">등록된 영상이 없습니다.</div>`;
                }

                trackHtml += `
                    <div class="track-item" id="track_${tIdx}">
                        <div class="track-title" onclick="toggleTrack(${tIdx})">${track.title} <span>▼</span></div>
                        <div class="track-content">
                            <div class="video-btn-group">${btnHtml}</div>
                            <div class="inline-player-wrapper" id="player_${tIdx}"></div>
                        </div>
                    </div>
                `;
            });
            trackListEl.innerHTML = trackHtml;

            document.getElementById('albumModal').classList.add('active');
            document.body.classList.add('modal-open');
        }

        function toggleTrack(tIdx) {
            const el = document.getElementById(`track_${tIdx}`);
            el.classList.toggle('active');
        }

        // 아이프레임 플레이어 바로 재생
        function playVideo(playerId, ytId, btnEl) {
            // 버튼 활성화 표시
            const siblings = btnEl.parentElement.children;
            for(let i=0; i<siblings.length; i++) siblings[i].classList.remove('active');
            btnEl.classList.add('active');

            const player = document.getElementById(playerId);
            player.classList.add('active');
            player.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0" allow="autoplay; fullscreen"></iframe>`;
        }

        function closeModal() {
            document.getElementById('albumModal').classList.remove('active');
            document.body.classList.remove('modal-open');
            setTimeout(() => { document.getElementById('modalTrackList').innerHTML = ''; }, 300);
        }
    </script>
</body>
</html>
