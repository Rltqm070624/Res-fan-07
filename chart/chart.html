<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MUSIC CHARTS</title>
    <meta name="description" content="실시간 음원 차트">
    <link rel="icon" type="image/png" href="../images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="chart.css">

    <script src="../js/theme-init.js"></script>

    <script src="../js/i18n.js"></script>
</head>
<body>

    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('charts', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container chart-page-container reveal active" style="flex:1;">
            <div class="section-header">
                <div class="section-title" data-i18n="chartTitle">MUSIC <span>CHARTS</span></div>
                <div class="chart-wave" id="chartWave" aria-hidden="true"></div>
                <div class="chart-updated" id="currentTime">데이터 로딩중...</div>
            </div>
            <div class="chart-wrap">
                <div class="chart-tab-row">
                    <div class="chart-tabbar" id="chartTabbar"></div>
                </div>
                <div class="chart-list" id="chartList">
                    <div class="chart-skel-row"></div>
                    <div class="chart-skel-row"></div>
                    <div class="chart-skel-row"></div>
                </div>
            </div>
        </div>

        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <!-- 캘린더 팝업 + 세부 일정 모달 (공용 컴포넌트) -->
    <div id="siteCalendarSlot"></div>
    <script>renderCalendarWidgets();</script>

    <script>
        // 하위 폴더(chart/)에서 실행되므로 이미지/데이터 경로 앞에 ../ 를 붙여야 함
        var SITE_ROOT = '../';
    </script>
    <script src="../js/member_data.js"></script>
    <script src="../js/common.js"></script>
    <script src="chart.js"></script>
</body>
</html>
