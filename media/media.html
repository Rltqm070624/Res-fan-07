<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MEDIA</title>
    <meta name="description" content="RESCENE(리센느) 영상 모음 — 컨텐츠, 음반 활동 컨텐츠, 음악방송 전체 아카이브.">
    <link rel="icon" type="image/png" href="../images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/i18n.css">
    <link rel="stylesheet" href="media.css">

    <script src="../js/theme-init.js"></script>
</head>
<body>

    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('media', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container media-page-container" style="flex: 1;">
            <div class="section-header media-hero">
                <div class="section-title">MEDIA <span>ARCHIVE</span></div>
            </div>
            <p class="media-hero-sub">컨텐츠 · 음반 활동 컨텐츠 · 음악방송 · 라이브 방송 · 공연 및 행사 — 리센느 영상을 한곳에서. <span class="media-count-badge" id="mediaCountBadge"></span></p>

            <div class="media-controls">
                <input type="text" class="media-search" id="mediaSearch" placeholder="제목 · 채널 검색" oninput="mediaApplyFilters()">
                <div class="media-tag-row" id="mediaTagRow"></div>
                <div class="media-subtag-row" id="mediaSubtagRow"></div>
                <div class="media-subtag2-row" id="mediaSubtag2Row"></div>
                <div class="media-controls-row">
                    <div class="media-sort-row" id="mediaSortRow">
                        <button type="button" class="ms-btn active" data-sort="new" onclick="mediaSetSort('new')">최신순</button>
                        <button type="button" class="ms-btn" data-sort="old" onclick="mediaSetSort('old')">오래된순</button>
                    </div>
                </div>
            </div>

            <div class="media-grid" id="mediaGrid"></div>
            <div class="media-loadmore-wrap">
                <button type="button" class="media-loadmore-btn" id="mediaLoadMoreBtn" onclick="mediaLoadMore()">더 불러오기</button>
            </div>
        </div>

        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <!-- 영상 재생 모달 -->
    <div class="modal-backdrop" id="mediaModalBackdrop" onclick="mediaClosePlayer()"></div>
    <div class="media-modal-wrapper" id="mediaModal">
        <button class="popup-close-btn" onclick="mediaClosePlayer()" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <div class="media-modal-head">
            <div class="media-modal-title" id="mediaModalTitle"></div>
            <div class="media-modal-date" id="mediaModalDate"></div>
        </div>
        <div class="media-modal-media" id="mediaModalMedia"></div>
        <div class="media-modal-nav">
            <button type="button" class="mm-nav-btn" id="mediaPrevBtn" onclick="mediaPrev()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                이전 영상
            </button>
            <button type="button" class="mm-nav-btn mm-nav-next" id="mediaNextBtn" onclick="mediaNext()">
                다음 영상
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
            </button>
        </div>
        <div class="media-modal-playlist" id="mediaModalPlaylist">
            <div class="mm-drag-handle" id="mmDragHandle">
                <span class="mm-drag-label">재생목록 <b id="mmPlaylistCount">0</b></span>
            </div>
            <ul class="mm-playlist-list" id="mmPlaylistList"></ul>
        </div>
    </div>

    <!-- 캘린더 팝업 + 세부 일정 모달 (공용 컴포넌트) -->
    <div id="siteCalendarSlot"></div>
    <script>renderCalendarWidgets();</script>

    <script src="../js/i18n.js"></script>
    <script>
        // 하위 폴더(media/)에서 실행되므로 이미지/데이터 경로 앞에 ../ 를 붙여야 함
        var SITE_ROOT = '../';
    </script>
    <script src="../js/common.js"></script>
    <script src="../js/contents_data.js"></script>
    <script src="../js/album_content_data.js"></script>
    <script src="../js/music_show_data.js"></script>
    <script src="../js/live_data.js"></script>
    <script src="../js/event_data.js"></script>
    <script src="../js/contents.js"></script>
    <script src="media.js"></script>
</body>
</html>
