name: Goods Updater Auto-Bot

on:
  schedule:
    - cron: '0 */6 * * *' # 6시간마다 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4 # ⭐️ v3에서 v4로 업데이트

      - name: Node.js 세팅
        uses: actions/setup-node@v4 # ⭐️ v3에서 v4로 업데이트
        with:
          node-version: '22' # ⭐️ Node.js 22 버전으로 업데이트

      - name: 패키지 설치
        run: |
          npm install
          npm install puppeteer

      - name: 굿즈 크롤러 실행
        run: node goods/goods_scraper.js

      - name: 결과 저장 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goods/goods_data.json
          git commit -m "Auto update goods_data.json" || exit 0
          git push
