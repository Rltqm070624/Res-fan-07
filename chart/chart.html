<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MUSIC CHARTS</title>
    <meta name="description" content="RESCENE(리센느) 실시간 음원 차트">
    <link rel="icon" type="image/png" href="../images/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/i18n.css">
    <link rel="stylesheet" href="chart.css">

    <script src="../js/theme-init.js"></script>

    <script src="../js/i18n.js"></script>
</head>
<body>

    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('charts', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container reveal active" style="flex:1;">
            <div class="section-header">
                <div class="section-title">MUSIC <span>CHARTS</span></div>
                <div class="chart-updated" id="currentTime">Loading..</div>
            </div>
            <div class="chart-wrap">
                <div class="chart-platform-legend" id="chartLegend"></div>
                <div class="chart-list" id="chartList">
                    <div class="chart-skel-card"></div>
                    <div class="chart-skel-card"></div>
                    <div class="chart-skel-card"></div>
                </div>
            </div>
        </div>

        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <div id="siteCalendarSlot"></div>
    <script>renderCalendarWidgets();</script>

    <script>
        var SITE_ROOT = '../';
    </script>
    <script src="../js/common.js"></script>
    <script src="chart.js"></script>
</body>
</html>
