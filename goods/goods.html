                </div>

                <div class="goods-item">
                    <div class="goods-img" id="ming-img-wrap"><img src="../images/goods/ming.jpg" alt="Ming"><div class="soldout-stamp"><span>SOLD</span></div></div>
                    <div class="goods-price-text" id="ming-price">가격 확인중...</div>
                    <div class="goods-stock-list"><div class="stock-row"><span class="shop-name">Kream <span class="stock-num" id="ming-weverse-status"></span></span><a href="https://kream.co.kr/products/985257" target="_blank" class="buy-btn" id="ming-weverse-btn">바로가기</a></div></div>
                </div>
                <div class="goods-item">
                    <div class="goods-img" id="ribbu-img-wrap"><img src="../images/goods/ribbu.jpg" alt="Ribbu"><div class="soldout-stamp"><span>SOLD</span></div></div>
                    <div class="goods-price-text" id="ribbu-price">가격 확인중...</div>
                    <div class="goods-stock-list"><div class="stock-row"><span class="shop-name">Kream <span class="stock-num" id="ribbu-weverse-status"></span></span><a href="https://kream.co.kr/products/985256" target="_blank" class="buy-btn" id="ribbu-weverse-btn">바로가기</a></div></div>

                    <div class="goods-stock-list"><div class="stock-row"><span class="shop-name">Kream <span class="stock-num" id="jjaero-weverse-status"></span></span><a href="https://kream.co.kr/products/985259" target="_blank" class="buy-btn" id="jjaero-weverse-btn">바로가기</a></div></div>

                    <div class="goods-stock-list"><div class="stock-row"><span class="shop-name">Kream <span class="stock-num" id="yam-weverse-status"></span></span><a href="https://kream.co.kr/products/985258" target="_blank" class="buy-btn" id="yam-weverse-btn">바로가기</a></div></div>
                </div>
            </div>
        </div>
        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <script>
        // 하위 폴더(goods/)에서 실행되므로 이미지/스크립트 경로 앞에 ../ 를 붙여야 함
        var SITE_ROOT = '../';
    </script>
    <script src="../js/i18n.js"></script>
    <script src="../js/common.js"></script>
    <script>
        async function fetchGoodsInventory() {
            try {
                const response = await fetch('goods_data.json?t=' + new Date().getTime());
                const data = await response.json();
                const itemShopMap = { remini: 'withmuu', jota: 'kream', ming: 'kream', ribbu: 'kream', jjaero: 'kream', yam: 'kream' };
                const items = ['remini', 'jota', 'ming', 'ribbu', 'jjaero', 'yam'];
                items.forEach(item => {
                    if (data[item]) {
                        if (data[item].price) document.getElementById(`${item}-price`).innerText = data[item].price;
                        const status = data[item][itemShopMap[item]];
                        const statusElem = document.getElementById(`${item}-weverse-status`);
                        const btnElem = document.getElementById(`${item}-weverse-btn`);
                        const imgWrapper = document.getElementById(`${item}-img-wrap`);
                        if (status !== undefined && statusElem && btnElem) {
                            if (status === "soldout") {
                                statusElem.innerText = "(품절)"; btnElem.innerText = "품절"; btnElem.classList.add("sold-out");
                                if (imgWrapper) imgWrapper.classList.add('is-soldout');
                            } else {
                                statusElem.innerText = "(재고: 여유)"; btnElem.innerText = "바로가기"; btnElem.classList.remove("sold-out");
                                if (imgWrapper) imgWrapper.classList.remove('is-soldout');
                            }
                        }
                    }
                });
            } catch (e) { console.log("굿즈 데이터 JSON 대기중..."); }
        }
        fetchGoodsInventory();
    </script>
</body>
</html>
