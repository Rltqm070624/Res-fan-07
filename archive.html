        let processedData = [];

        function renderList() {
            const container = document.getElementById('archiveListContainer');
            container.innerHTML = '';
            
            archiveData.forEach((album, albumIdx) => {
                let categories = { 'MV': [], '무대': [], '직캠': [], '음원': [], '기타': [] };
                
                album.tracks.forEach(track => {
                    if(track.videos) {
                        track.videos.forEach(vid => {
                            let cat = '기타';
                            const lbl = vid.label.toLowerCase();
                            if(lbl.includes('mv')) cat = 'MV';
                            else if(lbl.includes('음원') || lbl.includes('audio')) cat = '음원';
                            else if(lbl.includes('직캠') || lbl.includes('fancam')) cat = '직캠';
                            else if(lbl.includes('엠카') || lbl.includes('뮤뱅') || lbl.includes('인기가요') || lbl.includes('음중') || lbl.includes('쇼챔') || lbl.includes('더쇼') || lbl.includes('perf') || lbl.includes('showcase') || lbl.includes('live')) cat = '무대';
                            
                            categories[cat].push({ 
                                id: vid.id, 
                                btnLabel: album.tracks.length > 1 ? `[${track.title}] ${vid.label}` : vid.label 
                            });
                        });
                    }
                });

                let availableTabs = Object.keys(categories).filter(k => categories[k].length > 0);
                processedData.push({ albumTitle: album.title, categories: categories, availableTabs: availableTabs });

                const item = document.createElement('div');
                item.className = 'archive-item';
                item.id = `album_item_${albumIdx}`;
                
                // ⭐️ 무한루프 방지 (this.onerror=null;) 적용됨
                item.innerHTML = `
                    <div class="archive-item-header" onclick="toggleAlbum(${albumIdx})">
                        <div class="archive-item-thumb">
                            <img src="${album.cover}" alt="cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/100?text=NO+IMG'">
                        </div>
                        <div class="archive-item-title">${album.title}</div>
                        <div class="archive-item-icon">▼</div>
                    </div>
                    <div class="archive-item-content">
                        <div class="sub-tabs-container" id="tabs_${albumIdx}"></div>
                        <div class="video-btn-list" id="vbtns_${albumIdx}"></div>
                        <div class="inline-player" id="player_${albumIdx}"></div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleAlbum(idx) {
            const el = document.getElementById(`album_item_${idx}`);
            const isOpening = !el.classList.contains('active');
            
            document.querySelectorAll('.archive-item').forEach(item => item.classList.remove('active'));
            
            if (isOpening) {
                el.classList.add('active');
                renderTabs(idx);
            } else {
                document.getElementById(`player_${idx}`).innerHTML = '';
            }
        }

        function renderTabs(idx) {
            const data = processedData[idx];
            const tabContainer = document.getElementById(`tabs_${idx}`);
            
            if(data.availableTabs.length === 0) {
                tabContainer.innerHTML = '<div style="font-size:13px; color:#888;">등록된 영상이 없습니다.</div>';
                return;
            }

            let tabsHtml = '';
            data.availableTabs.forEach((tabName, tIdx) => {
                const isActive = tIdx === 0 ? 'active' : '';
                tabsHtml += `<button class="sub-tab-btn ${isActive}" onclick="selectTab(${idx}, '${tabName}', this)">${tabName}</button>`;
            });
            tabContainer.innerHTML = tabsHtml;

            selectTab(idx, data.availableTabs[0], tabContainer.firstElementChild);
        }

        function selectTab(albumIdx, tabName, btnEl) {
            const siblings = btnEl.parentElement.children;
            for(let i=0; i<siblings.length; i++) siblings[i].classList.remove('active');
            btnEl.classList.add('active');

            const videos = processedData[albumIdx].categories[tabName];
            const btnContainer = document.getElementById(`vbtns_${albumIdx}`);
            
            let vBtnsHtml = '';
            videos.forEach((vid, vIdx) => {
                const isActive = vIdx === 0 ? 'active' : '';
                vBtnsHtml += `<button class="video-btn ${isActive}" onclick="playVideo(${albumIdx}, '${vid.id}', this)">${vid.btnLabel}</button>`;
            });
            btnContainer.innerHTML = vBtnsHtml;

            if(videos.length > 0) {
                playVideo(albumIdx, videos[0].id, btnContainer.firstElementChild);
            }
        }

        function playVideo(albumIdx, ytId, btnEl) {
            if(btnEl) {
                const siblings = btnEl.parentElement.children;
                for(let i=0; i<siblings.length; i++) siblings[i].classList.remove('active');
                btnEl.classList.add('active');
            }

            const player = document.getElementById(`player_${albumIdx}`);
            player.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0" allow="autoplay; fullscreen"></iframe>`;
        }

        window.addEventListener('DOMContentLoaded', () => { renderList(); });
