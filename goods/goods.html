<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MERCH</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="goods.css">

    <script src="../js/theme-init.js"></script>
</head>
<body>
    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('goods', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 120px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container goods-page-container reveal active" id="goodsTop" style="flex: 1;">
            <div class="section-header">
                <div class="section-title" data-i18n="merchTitle">OFFICIAL <span>MERCH</span></div>
                <div class="goods-subtitle">WITHMUU · KTOWN4U · KREAM 판매가/재고를 비교해서 모아봤습니다. 6시간마다 자동 갱신됩니다.</div>
            </div>

            <div class="goods-layout">
                <aside class="goods-sidebar" id="goodsSidebar">
                    <!-- JS 렌더 -->
                </aside>

                <div class="goods-main">
                    <div class="goods-toolbar">
                        <div id="goodsResultCount" class="goods-result-count">상품을 불러오는 중...</div>
                    </div>

                    <div class="goods-grid-v2" id="goodsGrid">
                        <!-- JS 렌더 -->
                    </div>

                    <div id="goodsEndedToggle" class="goods-ended-toggle" style="display:none;"></div>
                </div>
            </div>

            <div class="stock-refresh-note">가격/재고 정보는 각 쇼핑몰 자동 수집 기준이며 실제와 다를 수 있습니다. 구매 전 반드시 판매처에서 최종 확인해 주세요.<br>해당 정보는 판매/중개 목적이 아니며, 각 링크를 통해 공식 판매처로 이동합니다.</div>
        </div>
        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <script>
        // 하위 폴더(goods/)에서 실행되므로 이미지/스크립트 경로 앞에 ../ 를 붙여야 함
        var SITE_ROOT = '../';
    </script>
    <script src="../js/common.js"></script>
    <script src="goods.js"></script>
</body>
</html>
