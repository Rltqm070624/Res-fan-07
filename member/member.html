<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MEMBERS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/i18n.css">
    <link rel="stylesheet" href="member.css">

    <script src="../js/theme-init.js"></script>
</head>
<body>
    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('members', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" class="mem-page-wrapper">
        <div class="section-container member-page-container">
            <div class="mem-header-row">
                <div class="section-title mem-page-title">
                    <span class="mem-page-title-en" id="memberPageTitleEn"></span>
                    <span class="mem-page-title-ko-row">
                        <span class="mem-page-title-ko" id="memberPageTitleKo"></span>
                        <span class="mem-bday-badge" id="memberBdayBadge" style="display:none;">🎂🎉</span>
                    </span>
                </div>
                <div class="mem-selector-row" id="memberSelectorRow"></div>
            </div>

            <div class="mem-detail-panel">
                <!-- 왼쪽 메인 이미지 영역 -->
                <div class="mem-main-col">
                    <div class="mem-hero" id="memberHeroBtn" onclick="openEraModal()">
                        <img id="memberHeroImg" class="mem-hero-img" src="" alt="">
                        <div class="mem-hero-overlay"></div>
                        <img id="memberSign" class="mem-sign" src="" alt="signature">
                        <span class="mem-era-preview-label" id="memberEraPreviewLabel"></span>
                        <span class="mem-era-zoom-hint">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                        </span>
                    </div>
                </div>

                <!-- ⭐️ 오른쪽 정보 및 포토 아카이브 영역 -->
                <div class="mem-info-col">
                    
                    <!-- 프로필 스탯 영역 (위로 정렬) -->
                    <div class="mem-profile-stats">
                        <div class="stat-row">
                            <span class="stat-label" data-i18n="memberBirthday">BIRTHDAY</span>
                            <span class="stat-val" id="memberBday"></span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label" data-i18n="memberPosition">POSITION</span>
                            <span class="stat-val" id="memberPosition"></span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label" data-i18n="memberMbti">MBTI</span>
                            <!-- ⭐️ 뱃지 디자인 삭제, 동일한 텍스트 밸류로 변경 -->
                            <span class="stat-val mbti-val" id="memberMbti"></span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label" data-i18n="memberSpecialty">SPECIALTY</span>
                            <span class="stat-val" id="memberSpecialty"></span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label" data-i18n="memberHobby">HOBBY</span>
                            <span class="stat-val" id="memberHobby"></span>
                        </div>
                    </div>

                    <!-- ⭐️ 포토 아카이브 영역 (하단 선 맞춤을 위해 래퍼 추가) -->
                    <div class="mem-archive-section">
                        <div class="mem-era-header">
                            <div class="mem-era-title" data-i18n="memberPhotoArchive">PHOTO <span>ARCHIVE</span></div>
                            <div class="mem-era-hint">Scroll to explore &rarr;</div>
                        </div>
                        <div class="mem-era-rail" id="memberEraRow"></div>
                    </div>
                    
                </div>
            </div>
        </div>

        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <!-- 포토 아카이브 확대 모달 -->
    <div class="modal-backdrop" id="memEraModalBackdrop" onclick="closeEraModal()"></div>
    <div class="mem-era-modal" id="memEraModal">
        <button class="popup-close-btn" onclick="closeEraModal()" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <img id="memEraModalImg" src="" alt="">
        <div class="mem-era-modal-label" id="memEraModalLabel"></div>
    </div>

    <!-- 캘린더 팝업 + 세부 일정 모달 -->
    <div id="siteCalendarSlot"></div>
    <script>renderCalendarWidgets();</script>

    <script>
        var SITE_ROOT = '../';
    </script>
    <script src="../js/i18n.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/member_data.js"></script>
    <script src="member.js"></script>
</body>
</html>
