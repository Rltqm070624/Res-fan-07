name: Goods Updater Auto-Bot

on:
  schedule:
    # ⭐️ 매 6시간마다 실행되도록 변경 (UTC 0, 6, 12, 18시 / 한국 시간 오전 9시, 오후 3시, 오후 9시, 새벽 3시)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: Node.js 세팅
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 패키지 설치 (puppeteer 포함)
        run: |
          npm install
          npm install puppeteer

      - name: 굿즈 크롤러 실행 (질문자님 경로 반영)
        run: node goods/goods_scraper.js

      - name: 결과 저장 및 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goods/goods_data.json
          git commit -m "Auto update goods_data.json" || exit 0
          git push
