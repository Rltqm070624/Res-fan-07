name: Namuwiki Media Updater Auto-Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      full_resync:
        description: '전체 재동기화 (기존 데이터 무시하고 나무위키 기준으로 완전히 새로 씀 — 날짜 오류 등을 바로잡을 때만 체크)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    env:
      FULL_RESYNC: ${{ inputs.full_resync }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Packages
        run: npm install

      # 각 스크립트는 독립적으로 실행되고, 실패해도(나무위키 구조 변경 등) 다른 스크립트는 계속 진행되도록 함.
      # 결과가 비정상적으로 비어있으면 스크립트 자체에서 기존 파일을 덮어쓰지 않고 종료 코드 1을 반환한다.
      - name: Scrape 콘텐츠 & 앨범 활동
        run: node scripts/scrape_contents_album.js
        continue-on-error: true

      - name: Scrape 음악 방송
        run: node scripts/scrape_music_shows.js
        continue-on-error: true

      - name: Scrape 라이브 방송
        run: node scripts/scrape_live.js
        continue-on-error: true

      - name: Scrape 공연 및 행사
        run: node scripts/scrape_events.js
        continue-on-error: true

      - name: Scrape 응원법
        run: node scripts/scrape_fanchant.js
        continue-on-error: true

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/contents_data.js js/album_content_data.js js/music_show_data.js js/live_data.js js/event_data.js fanchant/fanchant_data.js
          git commit -m "Auto update namuwiki-scraped media data" || exit 0
          git push
