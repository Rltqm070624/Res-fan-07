<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RESCENE ARCHIVE | MEMBERS</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;600;800;900&family=Noto+Sans+KR:wght@200;300;400;500;700&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- ⭐️ 상위 폴더의 공통 CSS와 자신의 폴더에 있는 CSS 호출 -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <link rel="stylesheet" href="../css/i18n.css">
    <link rel="stylesheet" href="member.css">

    <script src="../js/theme-init.js"></script>
</head>
<body>
    <div id="siteNavSlot"></div>
    <script src="../js/layout.js"></script>
    <script>renderSiteNav('members', '../', { calendar: true, lang: true });</script>

    <div id="mainWrapper" style="padding-top: 96px; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="section-container member-page-container" style="flex: 1;">
            <div class="section-header">
                <div class="section-title">THE <span>MEMBERS</span></div>
            </div>

            <div class="mem-selector-row" id="memberSelectorRow"></div>

            <div class="mem-detail-panel">
                <div class="mem-main-col">
                    <div class="mem-hero">
                        <img id="memberHeroImg" class="mem-hero-img" src="" alt="">
                        <div class="mem-hero-overlay"></div>
                        <img id="memberSign" class="mem-sign" src="" alt="signature">
                        <div class="mem-hero-name">
                            <span class="mem-name-en" id="memberNameEn"></span>
                            <span class="mem-name-ko" id="memberNameKo"></span>
                        </div>
                    </div>

                    <div class="mem-info-card">
                        <p class="mem-intro" id="memberIntro"></p>
                        <div class="mem-info-grid">
                            <div class="mem-info-item"><span class="mem-info-label">BIRTHDAY</span><span class="mem-info-val" id="memberBday"></span></div>
                            <div class="mem-info-item"><span class="mem-info-label">POSITION</span><span class="mem-info-val" id="memberPosition"></span></div>
                            <div class="mem-info-item"><span class="mem-info-label">MBTI</span><span class="mem-info-val" id="memberMbti"></span></div>
                            <div class="mem-info-item"><span class="mem-info-label">SPECIALTY</span><span class="mem-info-val" id="memberSpecialty"></span></div>
                            <div class="mem-info-item"><span class="mem-info-label">HOBBY</span><span class="mem-info-val" id="memberHobby"></span></div>
                        </div>
                    </div>
                </div>

                <div class="mem-photo-col">
                    <div class="mem-era-label-row">PHOTO <span>ARCHIVE</span></div>
                    <div class="mem-era-rail" id="memberEraRow"></div>
                    <div class="mem-era-preview" id="memberEraPreviewBtn" onclick="openEraModal()">
                        <img id="memberEraPreviewImg" src="" alt="">
                        <span class="mem-era-preview-label" id="memberEraPreviewLabel"></span>
                        <span class="mem-era-zoom-hint">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <div id="siteFooterSlot"></div>
        <script>renderSiteFooter('../');</script>
    </div>

    <!-- 포토 아카이브 확대 모달 -->
    <div class="modal-backdrop" id="memEraModalBackdrop" onclick="closeEraModal()"></div>
    <div class="mem-era-modal" id="memEraModal">
        <button class="popup-close-btn" onclick="closeEraModal()" aria-label="닫기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
        <img id="memEraModalImg" src="" alt="">
        <div class="mem-era-modal-label" id="memEraModalLabel"></div>
    </div>

    <!-- 캘린더 팝업 + 세부 일정 모달 (공용 컴포넌트) -->
    <div id="siteCalendarSlot"></div>
    <script>renderCalendarWidgets();</script>

    <script>
        // 하위 폴더(member/)에서 실행되므로 이미지 경로 앞에 ../ 를 붙여야 함
        var SITE_ROOT = '../';
    </script>
    <script src="../js/i18n.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/member_data.js"></script>
    <script src="member.js"></script>
</body>
</html>
